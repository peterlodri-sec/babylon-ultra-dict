name: QuantTikTok
targets:
  QuantTikTok:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - Sources/QuantTikTok
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.vaked.quant-tiktok
      INFOPLIST_FILE: Resources/Info.plist
      DEVELOPMENT_TEAM: 7CFQYBX575
      SWIFT_VERSION: "6.0"
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    entitlements:
      path: Resources/QuantTikTok.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.device.microphone: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: MLX
      - package: MLX_QUANT
  packages:
    MLX:
      url: https://github.com/ml-explore/mlx-swift
      from: "0.21.0"
    MLX_QUANT:
      url: https://github.com/ml-explore/mlx-swift
      from: "0.21.0"
