name: BABYLON-ultra-dict
targets:
  BABYLON-ultra-dict:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/Babilon
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.vaked.babylon-ultra-dict
      INFOPLIST_FILE: Resources/Info.plist
      DEVELOPMENT_TEAM: 7CFQYBX575
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
    entitlements:
      path: Resources/Babilon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
